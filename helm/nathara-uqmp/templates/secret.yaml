apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nathara-uqmp.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "nathara-uqmp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  UQMP_LINK_SECRET: {{ .Values.env.UQMP_LINK_SECRET | default "ganti-via-secret" | b64enc | quote }}
  {{- if .Values.env.AI_PROVIDER_KEY }}
  AI_PROVIDER_KEY: {{ .Values.env.AI_PROVIDER_KEY | b64enc | quote }}
  {{- else }}
  AI_PROVIDER_KEY: {{ "" | b64enc | quote }}
  {{- end }}
