# DB = cluster SHARED `staging-postgres-18` (network `staging-shared`,
# database `uqmp`, user `uqmp`) — OVERRIDE human 2026-11-23 (isolasi
# per-app dicabut; pola Safe Campus commit 4c98a2f). TIDAK ada service
# `db` lokal lagi; volume lama `uqmp-pgdata` DIARSIPKAN (JANGAN `down -v`
# — jalan mundur; container lama `uqmp-postgres` dibiarkan hidup).
#
# Kredensial: UQMP_DB_PASSWORD dari file VPS
# /home/marlendo/staging/docker/.env (JANGAN commit nilai asli).
# Runbook restart:
#   export UQMP_DB_PASSWORD="$(grep -E '^UQMP_DB_PASSWORD=' /home/marlendo/staging/docker/.env | cut -d= -f2-)"
#   docker compose --env-file /home/marlendo/nathara/.env.uqmp-staging up -d --no-deps app
services:
  app:
    build: .
    container_name: uqmp-app
    ports:
      - "3001:3001"
    environment:
      # Database shared (template tanpa secret — nilai via interpolasi env)
      - DATABASE_URL=postgres://uqmp:${UQMP_DB_PASSWORD:?UQMP_DB_PASSWORD wajib di env (file VPS shared)}@staging-postgres-18:5432/uqmp
      # SSO Supabase PROD (IdP). service_role HARAM. JWT_SECRET lama HARAM.
      - SUPABASE_URL=${SUPABASE_URL:-https://api.nathara.ac.id}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SSO_ISSUER_URL=${SSO_ISSUER_URL:-https://sso.nathara.ac.id}
      - SSO_JWKS_URL=${SSO_JWKS_URL:-https://api.nathara.ac.id/functions/v1/sso-jwks}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL:-https://pjm.nathara.ac.id/api/auth/sso/callback}
      - UQMP_SSO_ALLOWLIST_SUBS=${UQMP_SSO_ALLOWLIST_SUBS:-}
      # Kunci sesi app baru untuk audit-link signing (via file env VPS)
      - UQMP_LINK_SECRET=${UQMP_LINK_SECRET:?UQMP_LINK_SECRET wajib diisi via file env VPS}
      # AI provider NON-AKTIF default (dikosongkan eksplisit + komentar)
      - AI_PROVIDER_TYPE=${AI_PROVIDER_TYPE:-}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL:-}
      - AI_PROVIDER_KEY=${AI_PROVIDER_KEY:-}
      - AI_PROVIDER_MODEL=${AI_PROVIDER_MODEL:-}
    volumes:
      - uqmp-uploads:/app/uploads
    networks:
      - siakad-network
      - staging-shared
    restart: unless-stopped

volumes:
  uqmp-uploads:
    external: true

networks:
  siakad-network:
    external: true
  staging-shared:
    external: true
